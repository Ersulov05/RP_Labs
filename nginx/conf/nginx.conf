worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                       'upstream="$upstream_addr" cache="$upstream_cache_status"';

    sendfile on;

    upstream backend {
        hash $cookie_ASP.NET_SignalR consistent;
        # least_conn; Запрос отправляется серверу с наименьшим числом активных соединений.
        # ip_hash; Клиент с одного IP всегда попадает на один и тот же сервер.
        # least_time header; Выбирает сервер с наименьшей средней задержкой.
        # random two least_time=last_byte; Случайный выбор сервера.
        # hash $request_uri consistent; Распределение на основе пользовательского ключа (например, URI).
        server app1:5000;
        server app2:5000;
    }

    server {
        listen 80;
        server_name localhost;

        access_log /var/log/nginx/access.log detailed;

        location /rankHub {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
