services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  app1:
    build: ./Valuator
    volumes:
      - dpkeys:/keys
    container_name: app-instance-1
    ports:
      - "5001:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - redis
      - rabbitmq-pa3
    restart: unless-stopped

  app2:
    build: ./Valuator
    volumes:
      - dpkeys:/keys
    container_name: app-instance-2
    ports:
      - "5002:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - redis
      - rabbitmq-pa3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app1
      - app2

  rabbitmq-pa3:
    image: rabbitmq:3.13.7-management  
    container_name: rabbitmq-pa3
    hostname: rabbitmq-pa3
    volumes:
      - rabbitmq_pa3_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - '5672:5672'
      - '15672:15672'

  rank-calculator-1:
    build: ./RankCalculator
    container_name: rank-calculator-1
    depends_on:
      - redis
      - rabbitmq-pa3
    restart: unless-stopped

  rank-calculator-2:
    build: ./RankCalculator
    container_name: rank-calculator-2
    depends_on:
      - redis
      - rabbitmq-pa3
    restart: unless-stopped

  eventslogger1:
    build: ./EventsLogger
    container_name: eventslogger-1
    depends_on:
      - rabbitmq-pa3
    restart: unless-stopped

  eventslogger2:
    build: ./EventsLogger
    container_name: eventslogger-2
    depends_on:
      - rabbitmq-pa3
    restart: unless-stopped

volumes:
  rabbitmq_pa3_data:
  redis-data:
  dpkeys: