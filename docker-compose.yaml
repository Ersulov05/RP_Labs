services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  app1:
    build: ./Valuator
    volumes:
      - dpkeys:/keys
    container_name: app-instance-1
    ports:
      - "5001:5000"
    environment:
      - INSTANCE_ID=app1
      - REDIS_CONNECTION=redis:6379
    depends_on:
      - redis

  app2:
    build: ./Valuator
    volumes:
      - dpkeys:/keys
    container_name: app-instance-2
    ports:
      - "5002:5000"
    environment:
      - INSTANCE_ID=app2
      - REDIS_CONNECTION=redis:6379
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app1
      - app2

volumes:
  redis-data:
  dpkeys: